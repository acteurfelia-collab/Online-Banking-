
name: Build Online Banking APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o Online-Banking-demo-v1.2-source-1.zip -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Gradle wrapper absent du ZIP"
            exit 1
          fi
          DIR=$(dirname "$PROJECT")
          chmod +x "$PROJECT"
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Online-Banking-demo-APK
          path: source/**/build/outputs/apk/debug/*.apk
